services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:80"  # Changed from 5000 to avoid conflict
      - "5003:443"  # Changed from 5001 to avoid conflict
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=lowcodeapi;Username=postgres;Password=postgres;Port=5432
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Seq=http://seq:5341
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:44436
    depends_on:
      - postgres
      - redis
    networks:
      - lowcodeapi-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lowcodeapi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lowcodeapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Mapped to 6380 on host to avoid conflict with local Redis
    volumes:
      - redis-data:/data
    networks:
      - lowcodeapi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq-data:/data
    networks:
      - lowcodeapi-network

volumes:
  postgres-data:
  redis-data:
  seq-data:

networks:
  lowcodeapi-network:
    driver: bridge

